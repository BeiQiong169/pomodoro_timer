server:
  port: 8080

spring:
  profiles:
    active: local
  datasource:
    url: "jdbc:mysql://localhost:3306/pomodoro?useUnicode=true&characterEncoding=utf8&connectionTimeZone=%2B08:00&forceConnectionTimeZoneToSession=true&allowPublicKeyRetrieval=true&useSSL=false"
    username: pomodoro_app
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.pomodoro.model
  configuration:
    map-underscore-to-camel-case: true
